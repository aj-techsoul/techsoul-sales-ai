<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSoul AI - Admin Login</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        /* Decorative background blobs - hide in some light themes for premium look */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: 1;
            display: none;
        }

        body[data-theme="dark"]::before, body[data-theme="cyber"]::before,
        body[data-theme="dark"]::after, body[data-theme="cyber"]::after {
            display: block;
        }

        body::before {
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: 10%;
            left: 10%;
            opacity: 0.4;
        }

        body::after {
            background: radial-gradient(circle, var(--badge-success-text, #10b981) 0%, transparent 70%);
            bottom: 10%;
            right: 10%;
            opacity: 0.3;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: var(--radius);
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 10;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 45px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .logo h2 {
            font-size: 26px;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span {
            font-size: 13px;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            outline: none;
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--input-bg);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger, #ef4444);
            color: var(--danger, #fca5a5);
            padding: 10px 15px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary) !important;
            border: none;
            outline: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-light);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: var(--primary-hover) !important;
            box-shadow: 0 6px 18px var(--primary-light);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .back-link i {
            margin-right: 5px;
        }
    </style>
    <!-- Theme System Support -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <script src="{{ url_for('static', filename='js/theme_manager.js') }}"></script>
    <script>
        (function() {
            const localTheme = localStorage.getItem('techsoul_theme');
            const sessionTheme = "{{ session.get('theme') or '' }}";
            const themeToApply = sessionTheme || localTheme || 'blue';
            document.documentElement.setAttribute('data-theme', themeToApply);
            document.addEventListener('DOMContentLoaded', () => {
                document.body.setAttribute('data-theme', themeToApply);
                if (typeof ThemeManager !== 'undefined') {
                    ThemeManager.init(sessionTheme);
                }
            });
        })();
    </script>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <i class="fa-solid fa-square-poll-vertical"></i>
            <h2>TechSoul AI</h2>
            <span>Admin Console Login</span>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <div class="footer-links" style="margin-top: 20px; font-size: 13px; color: #94a3b8;">
            Don't have an account? <a href="/register" style="color: #38bdf8; text-decoration: none; font-weight: 500;">Register here</a>
        </div>

        <a href="/" class="back-link">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Consultant Chat
        </a>
    </div>

</body>
</html>
