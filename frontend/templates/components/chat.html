<!-- ==========================================
     CHAT AREA
========================================== -->

<div class="chat-area">

    <!-- ==========================
         CHAT BOX
    =========================== -->

    <div id="chat-box" class="chat-box">

        <!-- Messages are added dynamically -->

    </div>

    <!-- ==========================
         PROJECT SELECTION
    =========================== -->

    <div id="project-section"
         class="selection-panel"
         style="display:none;">

        {% include "components/project_cards.html" %}

    </div>

    <!-- ==========================
         FEATURE SELECTION
    =========================== -->

    <div id="feature-section"
         class="selection-panel"
         style="display:none;">

        {% include "components/feature_cards.html" %}

    </div>

    <!-- ==========================
         TYPING INDICATOR
    =========================== -->

    <div id="typing-indicator"
         class="typing-indicator"
         style="display:none;">

        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>

    </div>

    <!-- ==========================
         INPUT AREA
    =========================== -->

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            autocomplete="off">

        <button id="send-btn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>
