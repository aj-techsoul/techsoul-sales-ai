<!-- ==========================================
     FEATURE SELECTION
========================================== -->

<div class="feature-selector">

    <div class="selector-header">

        <h3>Select Required Features</h3>

        <p>
            You can choose multiple features for your project.
        </p>

    </div>

    <div class="feature-grid">

        <!-- Login -->

        <div class="feature-card"
             data-feature="Login System">

            <div class="feature-icon">🔐</div>

            <span>Login System</span>

        </div>

        <!-- Admin -->

        <div class="feature-card"
             data-feature="Admin Panel">

            <div class="feature-icon">👨‍💼</div>

            <span>Admin Panel</span>

        </div>

        <!-- Dashboard -->

        <div class="feature-card"
             data-feature="Dashboard">

            <div class="feature-icon">📊</div>

            <span>Dashboard</span>

        </div>

        <!-- Reports -->

        <div class="feature-card"
             data-feature="Reports">

            <div class="feature-icon">📑</div>

            <span>Reports</span>

        </div>

        <!-- Payment -->

        <div class="feature-card"
             data-feature="Payment Gateway">

            <div class="feature-icon">💳</div>

            <span>Payment Gateway</span>

        </div>

        <!-- Analytics -->

        <div class="feature-card"
             data-feature="Analytics">

            <div class="feature-icon">📈</div>

            <span>Analytics</span>

        </div>

        <!-- Inventory -->

        <div class="feature-card"
             data-feature="Inventory Management">

            <div class="feature-icon">📦</div>

            <span>Inventory</span>

        </div>

        <!-- Role -->

        <div class="feature-card"
             data-feature="Role Management">

            <div class="feature-icon">👥</div>

            <span>Role Management</span>

        </div>

        <!-- API -->

        <div class="feature-card"
             data-feature="API Integration">

            <div class="feature-icon">🔌</div>

            <span>API Integration</span>

        </div>

        <!-- Email -->

        <div class="feature-card"
             data-feature="Email Notifications">

            <div class="feature-icon">📧</div>

            <span>Email Alerts</span>

        </div>

        <!-- SMS -->

        <div class="feature-card"
             data-feature="SMS Notifications">

            <div class="feature-icon">📱</div>

            <span>SMS Alerts</span>

        </div>

        <!-- AI -->

        <div class="feature-card"
             data-feature="AI Chatbot">

            <div class="feature-icon">🤖</div>

            <span>AI Chatbot</span>

        </div>

    </div>

    <!-- Continue Button -->

    <div class="feature-actions">

        <button id="continue-features"
                class="continue-btn">

            Continue →

        </button>

    </div>

</div>
