<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSoul AI - Customer Registration</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            overflow-y: auto;
            padding: 40px 10px;
            position: relative;
        }

        /* Background blobs - only show on dark/cyber themes */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: 1;
            display: none;
        }

        body[data-theme="dark"]::before, body[data-theme="cyber"]::before,
        body[data-theme="dark"]::after, body[data-theme="cyber"]::after {
            display: block;
        }

        body::before {
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: 5%;
            left: 5%;
            opacity: 0.3;
        }

        body::after {
            background: radial-gradient(circle, var(--badge-success-text, #10b981) 0%, transparent 70%);
            bottom: 5%;
            right: 5%;
            opacity: 0.2;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: var(--radius);
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 10;
            text-align: center;
        }

        .logo {
            margin-bottom: 25px;
        }

        .logo i {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .logo h2 {
            font-size: 24px;
            color: var(--text-color);
            font-weight: 700;
        }

        .logo span {
            font-size: 13px;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            outline: none;
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--input-bg);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger, #ef4444);
            color: var(--danger, #fca5a5);
            padding: 10px 15px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary) !important;
            border: none;
            outline: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-light);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: var(--primary-hover) !important;
            box-shadow: 0 6px 18px var(--primary-light);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
    <!-- Theme System Support -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <script src="{{ url_for('static', filename='js/theme_manager.js') }}"></script>
    <script>
        (function() {
            const localTheme = localStorage.getItem('techsoul_theme');
            const sessionTheme = "{{ session.get('theme') or '' }}";
            const themeToApply = sessionTheme || localTheme || 'blue';
            document.documentElement.setAttribute('data-theme', themeToApply);
            document.addEventListener('DOMContentLoaded', () => {
                document.body.setAttribute('data-theme', themeToApply);
                if (typeof ThemeManager !== 'undefined') {
                    ThemeManager.init(sessionTheme);
                }
            });
        })();
    </script>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
            <h2>Create Account</h2>
            <span>Register to save chats, view quotes & proposals</span>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="company">Company Name</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="name" name="company" placeholder="My Company Ltd" autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number (with Country Code)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="phone" name="phone" placeholder="+1 2125551234 or +91 9876543210" autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="/login">Sign In here</a>
        </div>

        <a href="/" class="back-link">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Consultant Chat
        </a>
    </div>

</body>
</html>
